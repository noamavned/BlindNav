<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlindNav - Main</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./glasses.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-2 shadow" role="navigation" aria-label="Main menu">
        <div class="container-fluid">
            <h1 class="navbar-brand mb-0 fs-5">BlindNav - Main Dashboard</h1>
            <span class="badge bg-success" id="connectionStatus" aria-live="polite">Connected to Glasses</span>
        </div>
    </nav>
    <div class="container-fluid px-2 pb-5">
        <div class="row g-3 h-100">
            <div class="col-12 col-lg-4 left-control-panel">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-white font-weight-bold d-flex justify-content-between align-items-center py-2">
                        <span>Camera &amp; Spatial Radar</span>
                        <button id="btnAnnounceStatus" class="btn btn-sm btn-light text-dark fw-bold py-0 px-2" aria-label="Announce sensor and camera status">🔊 Announce Status</button>
                    </div>
                    <div class="card-body p-0 position-relative cam-container d-flex align-items-center justify-content-center">
                        <img id="liveStream" src="https://picsum.photos/seed/blindnav/600/400" alt="Live camera feed..." class="img-fluid">
                        <div id="cameraWarningOverlay" class="position-absolute top-0 start-0 w-100 p-2 text-center d-flex flex-column align-items-center gap-1" style="pointer-events: none;" aria-live="assertive">
                            <span class="cam-warning-badge">⚠️ Obstacle nearby on the left (1.2 m)</span>
                        </div>
                    </div>
                    <div id="radarContainer" class="card-footer p-0">
                        <canvas id="radarCanvas" width="400" height="200"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-8 right-column">
                <div class="card shadow-sm flex-grow-1">
                    <div class="card-header bg-info text-white font-weight-bold d-flex justify-content-between align-items-center py-2">
                        <span>Set Destination &amp; Safe Walking Route</span>
                        <button id="btnLocateUser" class="btn btn-sm btn-light text-dark fw-bold" aria-label="Locate my current position">🎯 Locate Me</button>
                    </div>
                    <div class="card-body d-flex flex-column p-2">
                        <div class="row g-2 mb-2">
                            <div class="col-12 col-md-6 position-relative">
                                <label for="startLocation" class="visually-hidden">Starting location</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="startLocation" placeholder="Starting location..." autocomplete="off">
                                    <button class="btn btn-outline-primary" type="button" id="btnSelectStart" aria-label="Pick starting location on the map">📍</button>
                                </div>
                                <div id="startSuggestions" class="list-group autocomplete-suggestions" role="listbox"></div>
                            </div>
                            <div class="col-12 col-md-6 position-relative">
                                <label for="endLocation" class="visually-hidden">Destination</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="endLocation" placeholder="Where would you like to go?..." autocomplete="off">
                                    <button class="btn btn-outline-danger" type="button" id="btnSelectEnd" aria-label="Pick destination on the map">🚩</button>
                                </div>
                                <div id="endSuggestions" class="list-group autocomplete-suggestions" role="listbox"></div>
                            </div>
                        </div>
                        <div class="alert alert-secondary text-center d-none py-1 mb-2" id="mapInstruction" aria-live="polite"></div>
                        <div id="osmMap" aria-hidden="true"></div>
                        <div class="d-grid gap-2 mt-2">
                            <button type="button" id="btnCalculateRoute" class="btn btn-success" aria-label="Calculate a safe walking route">🚀 Calculate Route</button>
                        </div>
                    </div>
                </div>
                <div class="card shadow-sm" style="flex-shrink: 0;">
                    <div class="card-body p-2">
                        <div id="navStatus" class="text-center fw-bold small mb-1" aria-live="assertive"></div>
                        <div id="routeSteps" class="list-group small" aria-live="polite">
                            <div class="list-group-item text-muted text-center py-2">No route calculated yet. Choose a destination and press "Calculate Route".</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="./init-glasses.js"></script>
</body>
</html>
