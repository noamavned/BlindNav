<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - BlindNav</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-2 shadow" role="navigation" aria-label="Main menu">
        <div class="container-fluid">
            <h1 class="navbar-brand mb-0 fs-5">BlindNav - Login</h1>
        </div>
    </nav>

    <main class="login-wrap">
        <div class="card shadow-sm login-card">
            <div class="card-header bg-dark text-white font-weight-bold py-2">
                Sign In
            </div>
            <div class="card-body p-3">
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" autocomplete="username">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <!-- add show password button -->
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" name="password" autocomplete="current-password">
                            <button class="btn" type="button" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <p id="loginError" class="text-danger small d-none" role="alert"></p>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-dark">Sign In</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script type="module" src="init-login.js"></script>
</body>
</html>
